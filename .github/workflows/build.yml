name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json

      - name: Build
        run: dotnet build src/Kropp.sln -c Release

      # The integration tests start Postgres with Testcontainers; the runner has Docker.
      - name: Test
        run: dotnet test src/Kropp.sln -c Release --no-build
